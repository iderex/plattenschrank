name: Dependency review

on:
  pull_request:

# Read-only: the dependency-review action only inspects the PR diff against the
# advisory database, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `name:` on this job, so the check run keeps the job id
  # ("dependency-review") as its literal name. A ruleset requires a status check
  # by that literal name, so renaming the job later renames the check run and a
  # rule naming the old string then matches nothing.
  #
  # The ruleset on this repository requires no status check today:
  #
  #     gh api repos/iderex/plattenschrank/rulesets --jq '.[] | "\(.name) \(.enforcement)"'
  #     gate  active
  #     gh api repos/iderex/plattenschrank/rulesets/20519975 --jq '[.rules[].type]'
  #     ["deletion","non_fast_forward","pull_request"]
  #
  # So nothing is broken by a rename today, and this comment records why the name
  # is held still before that changes. Which checks the ruleset should require is
  # issue #36.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: any known vulnerability in a newly introduced or
          # upgraded dependency blocks the PR. Relax only with a documented
          # reason.
          fail-on-severity: low
