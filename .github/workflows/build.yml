# The one job whose check-run name a ruleset can require literally.
#
# The job is called `build` and the check run it produces is called `build`,
# because a ruleset matches a check run by its name and nothing else. Renaming
# it removes it from every ruleset that required the old name, and the removal
# is silent: the gate stops being required and goes on reporting green. Treat
# the name as an interface rather than a label.
#
# The legs run in order and the job stops at the first one that fails, which is
# the default behaviour of a step list and is relied on here rather than
# re-implemented. Nothing after a red leg runs, so a failure is attributed to
# the leg that produced it.
#
# Which legs exist here today is not the whole set the gate is working towards.
# `docs/gate-parity.md` holds the target one row per check, and the rows that
# name this job are #20 for the formatter and linter, #21 for the type checker
# in strict mode, #23 and #24 for the headless and offline proofs, #26 for the
# dependency floor, #27 for the audit of the installed graph, and #28 for
# coverage. Each of those adds its leg here under its own issue.
name: build

on:
  # Both triggers, matching `unicode-guard.yml`. The pull-request trigger is
  # what a ruleset reads. The push trigger is what makes a branch pushed
  # without a pull request produce the same verdict, which is how a deliberate
  # failure can be demonstrated on a scratch branch without opening one.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only at the top level. No leg here writes anything back to the
# repository, and a job that cannot write cannot be turned into one that
# publishes by an edit that nobody reads closely.
permissions:
  contents: read

# Cancel a superseded run on the same ref. Every leg is a pure read of the
# tree at a commit, so an obsolete run has no result worth waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The literal a ruleset requires. Keep it and the job id the same so the
    # two cannot drift apart.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in
          # .git/config where a later step could read it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install in locked mode
        # `--locked` refuses to resolve anything: it fails if `uv.lock` does not
        # already satisfy `pyproject.toml`, so this leg reds on a dependency
        # change that skipped the lock rather than quietly installing a graph
        # nobody recorded. The interpreter comes from `.python-version`.
        run: uv sync --locked --extra test --extra typecheck

      - name: Type check
        # No arguments: strict mode, the interpreter version and the directory
        # under check are all in `[tool.mypy]` in `pyproject.toml`, so what this
        # leg refuses is readable from the repository rather than from a run
        # log. The checker itself is pinned in the `typecheck` extra and comes
        # out of `uv.lock` with everything else, so this leg refuses the same
        # set on two days unless a pull request moved it. `--no-sync` keeps the
        # leg above the only thing that touched the environment.
        run: uv run --no-sync mypy

      - name: Run the default suite with no display and without elevation
        # The default selection is `-m unit`, set in `pyproject.toml`, so this
        # runs the gated set and nothing else. What it deliberately leaves out
        # is the network-bound and hardware-bound half, and #29 is what makes
        # this job print that in a line a reader of a green check can see.
        #
        # Two of the four conditions in
        # `docs/decisions/0012-headless-and-cpu-by-default.md` are established
        # here rather than assumed of the runner, because a hosted runner that
        # happens to have no display today is not the same as a suite that
        # cannot use one. `env -u` removes both display variables for the
        # duration of the run, and the root check fails the leg closed rather
        # than letting a suite that held privilege report that it did not need
        # any. What each was is printed, so a reader of a green check can see
        # the conditions rather than take them on trust.
        run: |
          set -euo pipefail
          echo "uid=$(id -u) user=$(id -un) DISPLAY=${DISPLAY-<unset>} WAYLAND_DISPLAY=${WAYLAND_DISPLAY-<unset>}"
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::This leg ran as root, so it proves nothing about a suite that runs unprivileged."
            exit 1
          fi
          env -u DISPLAY -u WAYLAND_DISPLAY uv run --no-sync pytest

      - name: Audit the installed graph
        # `dependency-review.yml` reads what a pull request ADDS. It says
        # nothing about what is already here, so a package that becomes
        # vulnerable months after it landed produces no signal anywhere on this
        # repository. This leg reads the whole graph, every run.
        #
        # The graph audited is the one installed, because `uv sync --locked`
        # above installs exactly what `uv.lock` records and `uv export --locked`
        # writes exactly the same set out. `--all-extras` means an extra added
        # later is covered without anybody editing this line, and `--no-deps`
        # stops the auditor resolving anything of its own: the exported file is
        # already the transitive closure, and a resolution here would audit a
        # graph nobody installs.
        #
        # `--strict` fails the leg where a dependency cannot be audited at all.
        # An auditor that could not reach the database has not found the graph
        # clean, and the two must not look the same.
        #
        # Last of the legs deliberately. Failing closed on a new advisory reds
        # work that has nothing to do with it, which is the intended cost, and
        # running it after the legs about the change means the log says which of
        # the two happened rather than leaving a reader to guess.
        env:
          PIP_AUDIT_VERSION: "2.9.0"
        run: |
          set -euo pipefail
          uv export --locked --all-extras --no-emit-project --format requirements-txt -o installed-graph.txt
          uvx --no-build "pip-audit@${PIP_AUDIT_VERSION}" --strict --disable-pip --no-deps --requirement installed-graph.txt
