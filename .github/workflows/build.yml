# The one job whose check-run name a ruleset can require literally.
#
# The job is called `build` and the check run it produces is called `build`,
# because a ruleset matches a check run by its name and nothing else. Renaming
# it removes it from every ruleset that required the old name, and the removal
# is silent: the gate stops being required and goes on reporting green. Treat
# the name as an interface rather than a label.
#
# The legs run in order and the job stops at the first one that fails, which is
# the default behaviour of a step list and is relied on here rather than
# re-implemented. Nothing after a red leg runs, so a failure is attributed to
# the leg that produced it.
#
# Which legs exist here today is not the whole set the gate is working towards.
# `docs/gate-parity.md` holds the target one row per check, and the rows that
# name this job are #21 for the type checker in strict mode, #23 for the
# headless proof, #27 for the audit of the installed graph, and #28 for
# coverage. Each of those adds its leg here under its own issue.
#
# This file also carries a second job, which produces its own check run and
# answers a different question. Its name is an interface in the same way, for
# the same reason, and the argument for it sits above it.
name: build

on:
  # Both triggers, matching `unicode-guard.yml`. The pull-request trigger is
  # what a ruleset reads. The push trigger is what makes a branch pushed
  # without a pull request produce the same verdict, which is how a deliberate
  # failure can be demonstrated on a scratch branch without opening one.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only at the top level. No leg here writes anything back to the
# repository, and a job that cannot write cannot be turned into one that
# publishes by an edit that nobody reads closely.
permissions:
  contents: read

# Cancel a superseded run on the same ref. Every leg is a pure read of the
# tree at a commit, so an obsolete run has no result worth waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The literal a ruleset requires. Keep it and the job id the same so the
    # two cannot drift apart.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in
          # .git/config where a later step could read it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install in locked mode
        # `--locked` refuses to resolve anything: it fails if `uv.lock` does not
        # already satisfy `pyproject.toml`, so this leg reds on a dependency
        # change that skipped the lock rather than quietly installing a graph
        # nobody recorded. The interpreter comes from `.python-version`.
        run: uv sync --locked --extra test --extra typecheck --extra lint

      - name: Format and lint
        # First of the legs that judge the tree, because it is the cheapest and
        # because a reader who has to fix something here would rather learn it
        # before waiting out a type check and a suite.
        #
        # Both halves come out of the lock file, so the version that judges here
        # is the version `uv sync` puts on a contributor's machine. What each one
        # refuses is in `[tool.ruff]` and `[tool.ruff.lint]` in `pyproject.toml`
        # rather than in flags here, which is what makes the local answer and
        # this one the same answer.
        #
        # `--check` and `--no-fix` are the same instruction twice: a gate reports
        # and never writes. A leg that repaired what it found would be green on a
        # tree nobody had corrected, and the correction would exist only inside a
        # run log.
        #
        # `set -e` is deliberately absent, and this is the one leg where it is.
        # Formatting and lint are two verdicts on one push, and stopping at the
        # first would send somebody back for a second round over a defect the
        # same run had already seen. Both run, both print, and the leg exits
        # non-zero if either did.
        run: |
          set -uo pipefail
          status=0
          uv run --no-sync ruff format --check --diff . || status=1
          uv run --no-sync ruff check --no-fix --output-format github . || status=1
          exit "$status"

      - name: Type check
        # No arguments: strict mode, the interpreter version and the directory
        # under check are all in `[tool.mypy]` in `pyproject.toml`, so what this
        # leg refuses is readable from the repository rather than from a run
        # log. The checker itself is pinned in the `typecheck` extra and comes
        # out of `uv.lock` with everything else, so this leg refuses the same
        # set on two days unless a pull request moved it. `--no-sync` keeps the
        # leg above the only thing that touched the environment.
        run: uv run --no-sync mypy

      - name: Run the default suite with no display, no elevation and no outbound connections
        # The default selection is `-m unit`, set in `pyproject.toml`, so this
        # runs the gated set and nothing else. What it deliberately leaves out
        # is the network-bound and hardware-bound half, and #29 is what makes
        # this job print that in a line a reader of a green check can see.
        #
        # The third condition in the name is established by the suite rather
        # than by anything written here, and the leg is named for it anyway so
        # that a reader of a green check is not left to find out by reading
        # `tests/conftest.py`. The block is a refusal at the socket layer inside
        # the test process, which is what makes a contributor's run and this one
        # the same run. It is not a firewall rule on the runner, because that
        # would hold in the one place nothing needs it. What it refuses and what
        # it does not is argued where it lives, and `tests/test_offline.py` is
        # what reds when it is removed.
        #
        # Two of the four conditions in
        # `docs/decisions/0012-headless-and-cpu-by-default.md` are established
        # here rather than assumed of the runner, because a hosted runner that
        # happens to have no display today is not the same as a suite that
        # cannot use one. `env -u` removes both display variables for the
        # duration of the run, and the root check fails the leg closed rather
        # than letting a suite that held privilege report that it did not need
        # any. What each was is printed, so a reader of a green check can see
        # the conditions rather than take them on trust.
        run: |
          set -euo pipefail
          echo "uid=$(id -u) user=$(id -un) DISPLAY=${DISPLAY-<unset>} WAYLAND_DISPLAY=${WAYLAND_DISPLAY-<unset>}"
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::This leg ran as root, so it proves nothing about a suite that runs unprivileged."
            exit 1
          fi
          env -u DISPLAY -u WAYLAND_DISPLAY uv run --no-sync pytest

      - name: Audit the installed graph
        # `dependency-review.yml` reads what a pull request ADDS. It says
        # nothing about what is already here, so a package that becomes
        # vulnerable months after it landed produces no signal anywhere on this
        # repository. This leg reads the whole graph, every run.
        #
        # The graph audited is the one installed, because `uv sync --locked`
        # above installs exactly what `uv.lock` records and `uv export --locked`
        # writes exactly the same set out. `--all-extras` means an extra added
        # later is covered without anybody editing this line, and `--no-deps`
        # stops the auditor resolving anything of its own: the exported file is
        # already the transitive closure, and a resolution here would audit a
        # graph nobody installs.
        #
        # `--strict` fails the leg where a dependency cannot be audited at all.
        # An auditor that could not reach the database has not found the graph
        # clean, and the two must not look the same.
        #
        # Last of the legs deliberately. Failing closed on a new advisory reds
        # work that has nothing to do with it, which is the intended cost, and
        # running it after the legs about the change means the log says which of
        # the two happened rather than leaving a reader to guess.
        env:
          PIP_AUDIT_VERSION: "2.9.0"
        run: |
          set -euo pipefail
          uv export --locked --all-extras --no-emit-project --format requirements-txt -o installed-graph.txt
          uvx --no-build "pip-audit@${PIP_AUDIT_VERSION}" --strict --disable-pip --no-deps --requirement installed-graph.txt

  # The floor the manifest declares, installed and run rather than asserted.
  #
  # `uv.lock` says what the gate installs and says nothing about the oldest
  # versions this package claims to support. A declared lower bound nobody tests
  # is a claim, and the way it is found to be wrong is an operator on an older
  # distribution meeting a missing keyword argument at run time.
  #
  # Its own job rather than a leg of `build`, because it answers a different
  # question and a reader who sees `build` green should not be able to conclude
  # anything about the floor from it. It is here rather than in a file of its own
  # so that the two jobs a change to `pyproject.toml` has to satisfy are read
  # together.
  dependency-floor:
    name: dependency floor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Resolve every direct dependency down to the floor it declares
        # The refusal in the middle is the point of this leg rather than a
        # precaution. A red from the suite below proves the job ran and failed
        # and says nothing about which graph it ran against, so a job that
        # silently installed `uv.lock` and a job that installed the floor are
        # indistinguishable from their result. Comparing the two exports is what
        # tells them apart, and it fails closed: identical means this job proved
        # nothing about the floor and says so instead of passing.
        #
        # The comparison is derived rather than enumerated. Nothing here names a
        # dependency, so a package added to `pyproject.toml` later is covered
        # without anybody editing this file.
        #
        # `--no-header` is what makes the comparison mean anything. An export
        # writes the command that produced it into its first lines, and those two
        # commands differ, so two exports of one identical graph would differ as
        # well and the refusal below would never fire.
        #
        # `uv.lock` is rewritten in the checkout by the resolution and nothing
        # pushes it anywhere. The job holds `contents: read` from the workflow
        # above and the checkout keeps no credentials.
        run: |
          set -euo pipefail
          uv export --locked --extra test --no-emit-project --no-header --format requirements-txt -o locked-graph.txt
          uv lock --resolution lowest-direct
          uv export --frozen --extra test --no-emit-project --no-header --format requirements-txt -o floor-graph.txt
          if diff -q locked-graph.txt floor-graph.txt >/dev/null; then
            echo "::error::The floor resolution is the locked one, so this job installed the lock file and proved nothing about the floor."
            exit 1
          fi
          echo "What moved between the locked graph and the floor:"
          diff locked-graph.txt floor-graph.txt || true

      - name: Install the floor
        # `--frozen` installs the resolution the leg above wrote and refuses to
        # resolve anything of its own, so what runs below is the graph that was
        # printed rather than a second resolution nobody saw.
        run: uv sync --frozen --extra test

      - name: Say what was installed
        # A green run that does not say what it was green about is a green run
        # somebody will quote for a floor it never touched.
        run: uv pip freeze

      - name: Run the default suite against the floor
        # The same selection the gate runs, for the same reason: the floor is a
        # claim about the software an operator installs, and the gated set is
        # what this board says about that software.
        run: uv run --no-sync pytest
