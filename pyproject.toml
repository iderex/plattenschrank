[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plattenschrank"
# Static, and deliberately not read from the source tree. The command reads this
# through installed distribution metadata, so a version typed into a module
# cannot become the answer. Issue #17 asks for exactly that property and
# tests/test_cli.py is what refuses the other arrangement.
version = "0.0.0"
description = "Machine learning for digitised astronomical photographic plates"
readme = "README.md"
requires-python = ">=3.12"
# The numeric array library, and the only runtime dependency this package has.
# `docs/decisions/0001-implementation-language-and-toolchain.md` chose Python for
# this stack rather than in spite of it, and `src/plattenschrank/synthetic.py` is
# the first module that needs it. The floor is measured rather than guessed: the
# pull request that added it records the suite running against the resolution
# `uv lock --resolution lowest-direct` produces, which is where the floor is the
# version actually installed.
dependencies = ["numpy>=1.26.0"]

[project.scripts]
plattenschrank = "plattenschrank.cli:main"

[project.optional-dependencies]
# The bound is measured rather than copied. 7.0.0 is where
# `RunResult.assert_outcomes` gained its `deselected` argument, which
# `tests/test_marker_scheme.py` uses to show the default selection leaving a
# non-unit test out. On 6.2.5 those two tests are the only ones that fail, and
# the pull request that pinned this records the run.
test = [
    "pytest>=7.0.0",
    # The reference FITS and WCS reader, and it is here rather than in
    # `dependencies` for a reason that is the whole point of it.
    # `src/plattenschrank/synthetic.py` writes FITS itself and this reads the
    # result back, so what the suite proves is that an implementation nobody
    # here wrote accepts those bytes. A writer proved by its own reader proves
    # only that the file agrees with itself.
    #
    # Pinned exactly rather than floored, for the same reason the type checker
    # is: this is a judge whose verdicts the suite quotes, and a range means a
    # different judge on two days with no change to this tree.
    "astropy==7.2.0",
]
# Pinned exactly rather than floored, which is the opposite of the line above
# and for the opposite reason. A test dependency has a behaviour this suite
# needs and older versions lack, so a floor says what it needs. A type checker
# has no floor: every release moves what it refuses, so a range means the gate
# refuses a different set on two days with no change to this tree. The version
# moves in a pull request that carries the run it changed.
typecheck = ["mypy==2.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/plattenschrank"]

[tool.mypy]
# Strict from the first file rather than ratcheted later. A package that grows
# untyped and then meets a checker spends its next months on an ignore list, and
# the ignore list is what becomes permanent. Turning this on while the package
# is three modules costs nothing; turning it on at thirty is a project.
#
# What this is actually against is the failure this subject has: a stage returns
# an array of the wrong shape in the wrong units and nothing crashes. An
# ordinary checker does not see a shape or a unit. It sees a distinct type, so
# where a function's contract is a shape or a unit, the contract is written into
# the signature as its own type rather than into a comment, and this setting is
# what makes the checker hold the author to it.
files = ["src"]
# The floor `requires-python` declares, so the checker judges the oldest
# interpreter this package claims rather than whichever one is installed.
python_version = "3.12"
strict = true
# Not part of `strict`, and cheap here. It refuses a branch that cannot be
# reached, which on a pipeline is usually a narrowing that already happened
# somewhere above.
warn_unreachable = true
# There is no `[[tool.mypy.overrides]]` block, and its absence is the point
# rather than an omission. `tests/test_type_checking.py` refuses one that
# relaxes a rule, and refuses an inline `# type: ignore` in `src/`, so an ignore
# added later has to argue for itself in a pull request instead of arriving in a
# diff nobody reads to the bottom.

[tool.pytest.ini_options]
# Four markers and no more, one line of meaning each. `tests/conftest.py`
# refuses a test that carries none of them, so a requirement nobody stated
# cannot reach the gated set.
markers = [
    "unit: runs anywhere, with no display, no elevation, no graphics processor and no network",
    "integration_network: needs an archive to be reachable over the network",
    "integration_gpu: needs a graphics processor",
    "slow: runs long enough that it does not belong in the gate",
]
# Which of the markers above a test states its requirements with. It is its own
# setting because pytest's `markers` list also carries pytest's own built-in
# markers, and reading the scheme out of that list would let `parametrize` alone
# count as a stated requirement. `tests/test_marker_scheme.py` refuses a name
# here that is not registered above.
requirement_markers = ["unit", "integration_network", "integration_gpu", "slow"]
# The default selection is the gated set. Anything else has to be named on the
# command line, so a test that quietly needs a network cannot arrive in the gate
# by accident.
addopts = "-m unit"
testpaths = ["tests"]
